[project]
name = "policylens"
version = "0.1.0"
description = "PolicyLens FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "gunicorn>=21.2.0"
]

[tool.vercel]
entrypoint = "api:app"